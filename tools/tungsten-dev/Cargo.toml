[package]
name = "tungsten-dev"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Internal development tool for Tungsten devcontainer workflows"
publish = false

[[bin]]
name = "tungsten-dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
